<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#1f3a5f"/>
<title>登录 - N3 文法 小手册</title>
<style>
  :root{
    --bg:#f6f4ee;--card:#ffffff;--ink:#1c2434;--ink-soft:#475063;--muted:#7a8597;
    --line:#e6e2d6;--accent:#1f3a5f;--accent-soft:#dde6f1;--shadow:0 1px 2px rgba(20,30,50,.06),0 6px 18px rgba(20,30,50,.06);--radius:14px;
  }
  @media (prefers-color-scheme: dark){
    :root{--bg:#101521;--card:#172033;--ink:#eef1f6;--ink-soft:#b9c2d2;--muted:#8392a8;--line:#26324a;--accent:#9ec0ea;--accent-soft:#1d2c46;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35)}
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Hiragino Sans","Yu Gothic","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.65}
  a{color:var(--accent);text-decoration:none}
  .topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.85);backdrop-filter:saturate(180%) blur(12px);-webkit-backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--line)}
  @media (prefers-color-scheme: dark){.topbar{background:rgba(16,21,33,.78)}}
  .topbar-inner{display:flex;align-items:center;gap:8px;padding:10px 14px;max-width:520px;margin:0 auto}
  .topbar h1{font-size:15px;margin:0;font-weight:600;flex:1}
  .icon-btn{width:36px;height:36px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink-soft)}
  .icon-btn:hover{background:var(--accent-soft);color:var(--accent)}
  .wrap{max-width:520px;margin:0 auto;padding:12px 14px 40px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-top:12px}
  .card h3{margin:0 0 10px;font-size:13px;letter-spacing:.08em;color:var(--muted)}
  .inp{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);outline:0;font-size:15px;margin:6px 0}
  .inp:focus{border-color:var(--accent);background:var(--card)}
  .inp::placeholder{color:var(--muted)}
  .btn{width:100%;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:14px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;margin-top:8px}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn:active{transform:scale(.98)}
  .row{display:flex;gap:8px}
  .row .btn{flex:1}
  pre{margin:8px 0 0;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:12px;white-space:pre-wrap;word-break:break-all;max-height:260px;overflow:auto}
  .muted{font-size:12px;color:var(--muted);margin-top:6px}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a class="icon-btn" href="./index.html" aria-label="返回">‹</a>
    <h1>登录</h1>
    <a class="icon-btn" href="./index.html" aria-label="手册">⌂</a>
  </div>
</header>
<main class="wrap">
  <div class="card">
    <h3>账号</h3>
    <input id="u" class="inp" placeholder="用户名" autocomplete="username"/>
    <input id="p" class="inp" type="password" placeholder="密码" autocomplete="current-password"/>
    <button id="reg" class="btn">注册</button>
    <button id="login" class="btn primary">登录</button>
  </div>

  <div class="card">
    <h3>调试</h3>
    <div class="row">
      <button id="listU" class="btn">SELECT * FROM users</button>
      <button id="listS" class="btn">SELECT * FROM sessions</button>
    </div>
    <pre id="out">就绪</pre>
  </div>
</main>
<script>
const $=id=>document.getElementById(id);
const out=v=>$("out").textContent=typeof v==="string"?v:JSON.stringify(v,null,2);
const DEFAULT_API = location.hostname.includes("github.io") ? "https://jlpt.zhxsdxin.workers.dev" : location.origin;
const api=()=> (localStorage.getItem("jlpt_api")||DEFAULT_API).replace(/\/$/,"") || location.origin;
const tokenKey="jlpt_token";
const headers=()=>{const t=localStorage.getItem(tokenKey);return t?{Authorization:"Bearer "+t}:{}};
const redirect = new URLSearchParams(location.search).get("redirect");
if(redirect) $("out").textContent = "需登录后访问："+redirect;

// 本地无 worker 时的 mock（localStorage 演示，保证点了一定有反馈）
function mockUsers(){ try{ return JSON.parse(localStorage.getItem("mock_users")||"[]"); }catch(e){ return []; } }
function mockSessions(){ try{ return JSON.parse(localStorage.getItem("mock_sessions")||"[]"); }catch(e){ return []; } }
function saveMock(k,v){ localStorage.setItem(k, JSON.stringify(v)); }
async function sha256s(s){ const b=await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join(""); }

async function safeFetch(path, opts={}){
  const url = api()+path;
  try{
    const r = await fetch(url, opts);
    const txt = await r.text();
    let data; try{ data = JSON.parse(txt); }catch(e){ data = txt; }
    if(!r.ok) return {ok:false, status:r.status, data, url};
    return {ok:true, data, url};
  }catch(e){
    return {ok:false, error:String(e), url};
  }
}

function validInput(u,p){
  if(!u||!p) return "用户名/密码不能为空";
  if(u.length<2||u.length>20) return "用户名 2-20 字符";
  if(p.length<6||p.length>64) return "密码 6-64 字符";
  if(!/^[a-zA-Z0-9_\u4e00-\u9fa5-]+$/.test(u)) return "用户名仅允许字母数字_ - 中文";
  return null;
}
$("reg").onclick=async()=>{
  const username=$("u").value.trim(), password=$("p").value;
  const e=validInput(username,password); if(e) return out(e);
  const res = await safeFetch("/api/register",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username,password})});
  if(res.ok){ out({...res.data, tip:"注册成功，请点登录"}); return; }
  // 真实业务错误（如 409 已存在/403 满员）直接展示，不走 mock
  if(res.data && res.data.error && !res.data.mock) return out(res.data);
  // 仅网络/404 回退 mock（同 worker 限 5）
  const MAX_USERS = 5;
  const users = mockUsers();
  if(users.length >= MAX_USERS) return out({error:`注册已满（上限 ${MAX_USERS}），请通知🐴✨ (本地 mock)`, mock:true});
  if(users.find(u=>u.username===username)) return out({error:"用户名已存在 (本地 mock)", mock:true});
  const h = await sha256s(password);
  users.push({id:users.length+1, username, password_hash:h});
  saveMock("mock_users", users);
  out({ok:true, id:users.length, mock:true, tip:"Worker 未部署，已用本地 mock 注册成功，请点登录", api:res.url, fetchError:res.error||res.data});
};
$("login").onclick=async()=>{
  const username=$("u").value.trim(), password=$("p").value;
  const e2=validInput(username,password); if(e2) return out(e2);
  const res = await safeFetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username,password})});
  if(res.ok && res.data.token){
    localStorage.setItem(tokenKey,res.data.token); out(res.data);
    setTimeout(()=>{ location.href = redirect || "./index.html"; }, 400); return;
  }
  if(res.ok){ out(res.data); return; }
  if(res.data && res.data.error && !res.data.mock) return out(res.data);
  // 仅网络/404 回退 mock 登录
  const h = await sha256s(password);
  const users = mockUsers();
  const u = users.find(x=>x.username===username && x.password_hash===h);
  if(!u) return out({error:"账号或密码错误 (本地 mock)", mock:true, fetchError:res.error||res.data, api:res.url});
  const token = crypto.randomUUID();
  const sessions = mockSessions();
  sessions.push({id:sessions.length+1, user_id:u.id, token, expires_at:new Date(Date.now()+7*86400000).toISOString()});
  saveMock("mock_sessions", sessions);
  localStorage.setItem(tokenKey, token);
  out({ok:true, token, user:{id:u.id, username:u.username}, mock:true, tip:"Worker 未部署，已用本地 mock 登录"});
  setTimeout(()=>{ location.href = redirect || "./index.html"; }, 400);
};

$("listU").onclick=async()=>{
  const res = await safeFetch("/api/users",{headers:headers()});
  if(res.ok) return out(res.data);
  out({mock_users: mockUsers(), tip:"Worker 未部署，显示本地 mock", fetchError:res.error||res.data});
};
$("listS").onclick=async()=>{
  const res = await safeFetch("/api/sessions",{headers:headers()});
  if(res.ok) return out(res.data);
  out({mock_sessions: mockSessions(), tip:"Worker 未部署，显示本地 mock", fetchError:res.error||res.data});
};
</script>
</body>
</html>
