<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#1f3a5f" />
<title>N3 文法 小手册</title>
<style>
  :root{
    --bg:#f6f4ee;
    --card:#ffffff;
    --ink:#1c2434;
    --ink-soft:#475063;
    --muted:#7a8597;
    --line:#e6e2d6;
    --accent:#1f3a5f;
    --accent-soft:#dde6f1;
    --warn:#8a5a00;
    --warn-bg:#fff5dc;
    --ok:#1f6f4a;
    --ok-bg:#e0f1e7;
    --ruby:#c0392b;
    --shadow:0 1px 2px rgba(20,30,50,.06),0 6px 18px rgba(20,30,50,.06);
    --radius:14px;
    --topbar-bg:rgba(255,255,255,.85);
    --bottomnav-bg:rgba(255,255,255,.92);
  }
  @media (prefers-color-scheme: dark){
    :root:not(.light){
      --bg:#101521;
      --card:#172033;
      --ink:#eef1f6;
      --ink-soft:#b9c2d2;
      --muted:#8392a8;
      --line:#26324a;
      --accent:#9ec0ea;
      --accent-soft:#1d2c46;
      --warn:#f1c179;
      --warn-bg:#3a2e16;
      --ok:#7fcf9f;
      --ok-bg:#14322a;
      --ruby:#ff8a80;
      --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);
      --topbar-bg:rgba(16,21,33,.78);
      --bottomnav-bg:rgba(16,21,33,.85);
    }
  }
  :root.dark{
    --bg:#101521;--card:#172033;--ink:#eef1f6;--ink-soft:#b9c2d2;--muted:#8392a8;--line:#26324a;
    --accent:#9ec0ea;--accent-soft:#1d2c46;--warn:#f1c179;--warn-bg:#3a2e16;--ok:#7fcf9f;--ok-bg:#14322a;--ruby:#ff8a80;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);
    --topbar-bg:rgba(16,21,33,.78);--bottomnav-bg:rgba(16,21,33,.85);
  }
  :root.light{
    --bg:#f6f4ee;--card:#ffffff;--ink:#1c2434;--ink-soft:#475063;--muted:#7a8597;--line:#e6e2d6;
    --accent:#1f3a5f;--accent-soft:#dde6f1;--warn:#8a5a00;--warn-bg:#fff5dc;--ok:#1f6f4a;--ok-bg:#e0f1e7;--ruby:#c0392b;
    --shadow:0 1px 2px rgba(20,30,50,.06),0 6px 18px rgba(20,30,50,.06);
    --topbar-bg:rgba(255,255,255,.85);--bottomnav-bg:rgba(255,255,255,.92);
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}   /* 防止 display:flex 等样式覆盖 hidden 属性 */
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Hiragino Sans","Yu Gothic","PingFang SC","Microsoft YaHei","Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;line-height:1.65;-webkit-text-size-adjust:100%;overflow-x:hidden;max-width:100%}
  body{padding-bottom:env(safe-area-inset-bottom)}
  a{color:var(--accent);text-decoration:none}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

  /* ===== Top bar ===== */
  .topbar{
    position:sticky;top:0;z-index:20;
    background:var(--topbar-bg);
    backdrop-filter:saturate(180%) blur(12px);
    -webkit-backdrop-filter:saturate(180%) blur(12px);
    border-bottom:1px solid var(--line);
  }
  .topbar-inner{
    display:flex;align-items:center;gap:8px;
    padding:10px 14px;max-width:920px;margin:0 auto;
  }
  .topbar h1{font-size:19px;margin:0;font-weight:800;letter-spacing:.04em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:linear-gradient(135deg,var(--accent) 0%,#ff7a8a 70%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
  .topbar .actions{display:flex;gap:6px}
  .icon-btn{
    width:36px;height:36px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;
    color:var(--ink-soft);
  }
  .icon-btn:hover,.icon-btn[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
  .icon-btn svg{width:20px;height:20px}

  /* ===== Search ===== */
  .search-wrap{padding:8px 14px 12px;max-width:920px;margin:0 auto}
  .search{
    display:flex;align-items:center;gap:8px;background:var(--card);
    border:1px solid var(--line);border-radius:12px;padding:8px 12px;
  }
  .search input{
    flex:1;border:0;background:transparent;outline:0;font-size:15px;color:var(--ink);
  }
  .search input::placeholder{color:var(--muted)}
  .search .x{color:var(--muted);display:none}
  .search .x.show{display:inline}

  /* ===== List view ===== */
  .view{display:none;max-width:920px;margin:0 auto;padding:8px 12px 80px}
  .view.active{display:block}

  .unit-title{
    position:sticky;top:60px;z-index:5;
    font-size:12px;letter-spacing:.12em;color:var(--muted);
    text-transform:uppercase;
    padding:14px 6px 6px;background:linear-gradient(var(--bg) 70%,transparent);
  }
  .list-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  @media (min-width:680px){ .list-grid{grid-template-columns:1fr 1fr 1fr} }
  .card-item{
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:10px 12px;display:flex;flex-direction:column;gap:4px;cursor:pointer;
    transition:transform .08s ease;
  }
  .card-item:active{transform:scale(.98)}
  @media (hover:hover){
    .card-item:hover{
      transform:scale(1.035);
      box-shadow:0 8px 24px rgba(20,30,50,.14);
      border-color:var(--accent-soft);
      z-index:1;
      position:relative;
    }
  }
  .card-item .num{font-size:11px;color:var(--muted)}
  .card-item .pat{font-size:16px;font-weight:600;line-height:1.3;word-break:break-all}
  .card-item .zh{font-size:12px;color:var(--ink-soft);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card-item .badge{align-self:flex-start;font-size:10px;padding:1px 6px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
  .card-item.done{border-color:var(--ok);background:var(--ok-bg)}
  .card-item.keigo{
    border-style:dashed;border-color:var(--warn);background:var(--warn-bg);
  }
  .card-item.keigo .pat{color:var(--warn)}

  .empty{text-align:center;color:var(--muted);padding:60px 20px}

  /* ===== Detail view ===== */
  .detail{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 16px 16px;margin-top:8px;position:relative}
  @media (max-width:600px){
    .detail > img[src*="stalking.gif"]{width:120px!important;height:120px!important;top:2px!important;right:2px!important}
  }
  .detail .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:6px}
  .detail .meta .chip{background:var(--accent-soft);color:var(--accent);padding:1px 8px;border-radius:999px;font-weight:500}
  .detail h2{margin:0 0 4px;font-size:26px;letter-spacing:.01em;word-break:break-all}
  .detail h2 .alt{font-size:14px;color:var(--muted);font-weight:400;margin-left:6px}

  .sense{border-top:1px dashed var(--line);margin-top:16px;padding-top:14px}
  .sense:first-child{border-top:0;margin-top:0;padding-top:0}
  .sense .sense-label{
    display:inline-flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.14em;
    color:var(--accent);background:var(--accent-soft);border-radius:999px;
    padding:2px 10px;margin-bottom:10px;font-weight:600;
  }
  .section{margin-top:12px}
  .section h3{
    font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);
    margin:0 0 6px;font-weight:600;
  }
  .pill-row{display:flex;flex-wrap:wrap;gap:6px}
  .pill{
    font-family:"SF Mono","Menlo",monospace;font-size:13px;
    background:var(--accent-soft);color:var(--accent);
    padding:3px 9px;border-radius:8px;
    word-break:break-word;overflow-wrap:anywhere;max-width:100%;
  }
  .desc{color:var(--ink-soft);font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word}

  .examples{display:flex;flex-direction:column;gap:8px}
  .ex{
    border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg);
  }
  .ex .src{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
  .ex .src .no{background:var(--card);border:1px solid var(--line);padding:0 6px;border-radius:6px;font-size:11px;font-weight:600;color:var(--ink-soft)}
  .ex .src .tag{background:var(--accent-soft);color:var(--accent);padding:0 6px;border-radius:6px;font-size:11px;font-weight:500}

  /* ===== 朗读按钮 ===== */
  .speak{
    display:inline-flex;align-items:center;justify-content:center;
    width:26px;height:26px;border-radius:50%;
    background:var(--accent-soft);color:var(--accent);flex:none;
    transition:transform .08s ease;
  }
  .speak:active{transform:scale(.9)}
  .speak:hover{filter:brightness(.96)}
  .speak svg{width:14px;height:14px}

  /* ===== 隐藏假名标注 ===== */
  .hide-ruby rt{display:none!important}

  /* ruby 注音样式 - 修复手机标题汉字被假名往下压，小标题保持正常 */
  ruby{ ruby-position:over; -webkit-ruby-position:over; }
  ruby rt{font-size:.58em;color:var(--muted);font-weight:400;letter-spacing:0;line-height:1}
  .detail h2{line-height:1.35}
  .detail h2 ruby{display:ruby;line-height:1;word-break:break-word;ruby-position:over;-webkit-ruby-position:over}
  .detail h2 ruby rt{font-size:.38em;line-height:1}
  @media (max-width:600px){
    .detail h2{font-size:26px;line-height:1.35}
    .detail h2 ruby rt{font-size:.42em}
    .topbar h1{font-size:18px}
  }
  .ex .ja{font-size:16px;line-height:1.7;display:flex;align-items:flex-start;gap:8px;max-width:100%}
  .ex .ja > span{overflow-wrap:anywhere;word-break:break-word}
  .ex .ja > span{flex:0 1 auto}   /* 不撑满：喇叭紧跟句子文字，不靠最右 */
  .ex .ja .speak{margin-top:2px;width:22px;height:22px;flex:none}
  .ex .ja .speak svg{width:12px;height:12px}
  .ex .ja .target{color:var(--ruby);font-weight:600;background:rgba(192,57,43,.08);padding:0 2px;border-radius:3px}
  :root.dark .ex .ja .target{background:rgba(255,138,128,.18)}
  .ex .zh{font-size:13px;color:var(--ink-soft);margin-top:4px}
  .ex.hide-zh .zh{display:none}
  .ex.hide-ja .ja > span{filter:blur(4px);user-select:none;pointer-events:none}
  .ex.reveal-ja .ja > span{filter:none}

  .note{
    background:var(--warn-bg);color:var(--warn);
    border-radius:10px;padding:10px 12px;font-size:14px;line-height:1.6;
    border-left:3px solid var(--warn);white-space:pre-wrap;
  }

  /* 敬語详情 */
  .keigo-page{
    border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--bg);
    margin-bottom:10px;font-size:14px;white-space:pre-wrap;line-height:1.8;
    overflow-wrap:anywhere;word-break:break-word;max-width:100%;
  }
  .keigo-page .pg{font-size:11px;color:var(--muted);letter-spacing:.1em;margin-bottom:6px;font-weight:600}

  /* ===== Bottom nav (detail) ===== */
  .bottom-nav{
    position:fixed;left:0;right:0;bottom:0;z-index:30;
    background:var(--bottomnav-bg);backdrop-filter:saturate(180%) blur(12px);
    -webkit-backdrop-filter:saturate(180%) blur(12px);
    border-top:1px solid var(--line);
    padding:8px 12px calc(8px + env(safe-area-inset-bottom));
  }
  .bottom-inner{display:flex;gap:8px;max-width:920px;margin:0 auto;align-items:center}
  .btn{
    flex:1;height:40px;border-radius:10px;background:var(--card);border:1px solid var(--line);
    color:var(--ink);font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:4px;
  }
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn:disabled{opacity:.45}
  .progress{font-size:12px;color:var(--muted);padding:0 6px;white-space:nowrap}
  .fab{
    position:fixed;right:14px;bottom:calc(64px + env(safe-area-inset-bottom));
    z-index:25;width:48px;height:48px;border-radius:50%;
    background:var(--accent);color:#fff;box-shadow:var(--shadow);
    display:inline-flex;align-items:center;justify-content:center;
  }
  .fab[aria-pressed="true"]{background:var(--ruby)}
  .fab svg{width:22px;height:22px}

  /* ===== Switches ===== */
  .switches{display:flex;gap:8px;padding:6px 14px 0;max-width:920px;margin:0 auto;flex-wrap:wrap}
  .sw{
    display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-soft);
    background:var(--card);border:1px solid var(--line);padding:5px 10px;border-radius:999px;
  }
  .sw input{accent-color:var(--accent)}

  /* utility */
  .hide{display:none!important}
  kbd{font-family:"SF Mono",monospace;font-size:11px;background:var(--card);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:1px 4px}
</style>
<script>
/* 明暗主题：先于渲染应用，避免闪烁 */
(function(){ try{
  var t=localStorage.getItem('n3.theme');
  var dark = t ? t==='dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.classList.add(dark?'dark':'light');
}catch(e){} })();
</script>
</head>
<body>

<header class="topbar" id="topbar">
  <div class="topbar-inner">
    <button class="icon-btn" id="backBtn" aria-label="返回" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <h1 id="title">N3 文法 小手册</h1>
    <div class="actions">
      <button class="icon-btn" id="searchBtn" aria-label="搜索">

      </button>

<script src="data.js"></script>
<script>
/* ============================================================
 * 数据：N3_DATA（194 条语法）+ N3_KEIGO（第20単元 敬語）
 * 条目结构：
 *  id     : 编号（1~194）
 *  unit   : 单元（1~19，每 10 条一单元，第19单元=181~194）
 *  pattern: 句型（OCR 底稿，待校对）
 *  senses : 义项数组，每项 {connect[], desc, examples[{src,ja,zh}], note}
 * 敬語：N3_KEIGO = [{page, text}]
 * ============================================================ */
const UNIT_NAMES = Array.from({length:19}, (_,i)=>`第${i+1}単元`);
const KEIGO_ID = 'keigo';   // 敬語特殊条目 id
// 卡片覆盖：SWR 旧数据保持，后台拉新后平滑更新
async function loadCardOverrides(){
  try{
    const base=(localStorage.getItem("jlpt_api")||"https://jlpt.zhxsdxin.workers.dev").replace(/\/$/,"");
    const r=await fetch(base+"/api/cards",{cache:"no-store"}); if(!r.ok) return false;
    const list=await r.json();
    if(!Array.isArray(list) || !list.length) return false;
    let updated=false;
    list.forEach(o=>{
      const idx=N3_DATA.findIndex(x=>x.id===o.id);
      const merged = idx>=0 ? {...N3_DATA[idx], ...o.data} : o.data;
      const oldStr = idx>=0 ? JSON.stringify(N3_DATA[idx]) : "";
      const newStr = JSON.stringify(merged);
      if(oldStr !== newStr){
        if(idx>=0) N3_DATA[idx]=merged; else N3_DATA.push(merged);
        updated=true;
      }
    });
    return updated;
  }catch(e){ return false; }
}

/* ========== 状态 ========== */
const state = {
  view: 'list',           // 'list' | 'detail'
  current: null,
  query: '',
  hideZh: false,
  hideJa: false,
  onlyFav: false,
  favs: loadFavs(),
  done: loadDone()
};

function loadFavs(){ try{ return new Set(JSON.parse(localStorage.getItem('n3.favs')||'[]')) }catch(e){ return new Set() } }
function saveFavs(){ localStorage.setItem('n3.favs', JSON.stringify([...state.favs])) }
function loadDone(){ try{ return new Set(JSON.parse(localStorage.getItem('n3.done')||'[]')) }catch(e){ return new Set() } }
function saveDone(){ localStorage.setItem('n3.done', JSON.stringify([...state.done])) }

function stripTags(s){return (s||'').replace(/<[^>]+>/g,'')}

function allText(item){
  // 用于搜索/摘要：拼接 pattern + 所有义项文本
  const parts = [item.pattern];
  (item.senses||[]).forEach(s=>{
    if(s.desc) parts.push(s.desc);
    (s.examples||[]).forEach(e=>{ if(e.ja) parts.push(e.ja); if(e.zh) parts.push(e.zh); });
    if(s.note) parts.push(s.note);
  });
  return parts.join(' ');
}

function descPreview(item){
  const d = (item.senses||[]).map(s=>s.desc).filter(Boolean).join(' ');
  return d;
}

/* ========== 列表渲染 ========== */
function renderList(){
  const root = document.getElementById('listView');
  const q = state.query.trim().toLowerCase();
  const grouped = new Map();

  N3_DATA.forEach(item=>{
    if(state.onlyFav && !state.favs.has(item.id)) return;
    if(q){
      const hay = allText(item).toLowerCase();
      if(!hay.includes(q)) return;
    }
    const uname = UNIT_NAMES[item.unit-1];
    if(!grouped.has(uname)) grouped.set(uname, []);
    grouped.get(uname).push(item);
  });

  // 敬語入口放到最后（第20単元）
  if(!state.onlyFav){
    const showKeigo = !q || '敬語'.includes(q) || 'けいご'.includes(q) || 'keigo'.includes(q);
    if(showKeigo) grouped.set('第20単元 敬語', [{_keigo:true}]);
  }

  if(grouped.size===0){
    root.innerHTML = `<div class="empty">没有匹配的条目。<br/>试试更短的关键词，或关闭"仅收藏"。</div>`;
    return;
  }
  const html = [...grouped.entries()].map(([unit, items])=>{
    const cards = items.map(it=>{
      if(it._keigo){
        return `<div class="card-item keigo" data-id="${KEIGO_ID}">
          <div style="display:flex;justify-content:space-between;align-items:center">
            <span class="num">UNIT 20</span>
            <span class="badge">专题</span>
          </div>
          <div class="pat">敬語</div>
          <div class="zh">尊敬語 · 謙譲語 · 丁寧語</div>
        </div>`;
      }
      const fav = state.favs.has(it.id) ? 'done' : '';
      return `<div class="card-item ${fav}" data-id="${it.id}">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <span class="num">No.${String(it.id).padStart(3,'0')}</span>
          ${state.favs.has(it.id) ? '<span class="badge">★ 收藏</span>' : ''}
        </div>
        <div class="pat">${esc(it.pattern)}</div>
        <div class="zh">${esc(descPreview(it)).slice(0,42)}${descPreview(it).length>42?'…':''}</div>
      </div>`;
    }).join('');
    return `<div class="unit-title">${unit}</div><div class="list-grid">${cards}</div>`;
  }).join('');
  root.innerHTML = html;
  root.querySelectorAll('.card-item').forEach(el=>{
    const id = el.dataset.id;
    el.addEventListener('click',()=>openDetail(id === KEIGO_ID ? KEIGO_ID : parseInt(id,10)));
  });
}

function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

/* 例句中高亮当前句型：从 pattern 提取关键词（去括号/波浪符，按 / 拆选项，
   波浪符连接的重复词如 "にしろ〜にしろ" 再切段取 "にしろ"），kana 为 pattern 的假名读音
   （如 上(に)→うえに、代わりに→かわりに），长词优先，逐字去尾，允许单字。 */
function highlightJa(ja, pattern, kana){
  const e = esc(ja);
  if(!e || !pattern) return e;
  const kws = [];
  pattern.split('/').forEach(opt=>{
    const o = opt.replace(/[（）]/g,'');
    // 半角括号内为可选部分："ず(に)" → 同时生成 "ずに" 和 "ず"
    const pm = o.match(/^(.*?)\((.*?)\)(.*)$/);
    if(pm){
      const v1 = (pm[1]+pm[2]+pm[3]).replace(/[〜～〜˜~]/g,'');
      const v2 = (pm[1]+pm[3]).replace(/[〜～〜˜~]/g,'');
      if(v1) kws.push(v1);
      if(v2) kws.push(v2);
    }
    const clean = o.replace(/[〜～〜˜~]/g,'');
    if(clean) kws.push(clean);
    o.split(/[〜～〜˜~]/).forEach(seg=>{ if(seg) kws.push(seg); });
  });
  if(Array.isArray(kana)) kana.forEach(k=>{ if(k) kws.push(k); });
  const seen = new Set();
  const uniq = kws.filter(k=>{ if(seen.has(k)) return false; seen.add(k); return true; })
                  .sort((a,b)=>b.length-a.length);
  // 完整关键词优先；不中则逐字符去尾重试（覆盖活用/带助词形式，如 一方で→一方、てみる→てみ）。
  // 原生单字（如 間）允许单字匹配；长词去尾最低到 2 字，避免红到无关单字。
  for(const kw of uniq){
    const minLen = kw.length === 1 ? 1 : 2;
    for(let len = kw.length; len >= minLen; len--){
      const cand = kw.slice(0, len);
      if(e.includes(cand)){
        return e.split(cand).join(`<span class="target">${cand}</span>`);
      }
    }
  }
  return e;
}

/* ========== 视图切换（支持刷新停留 + 浏览器前进/后退） ========== */
let _navLock = false;
function syncNav(push){
  // 保存到 localStorage + URL hash，刷新后可恢复
  try{ localStorage.setItem('n3.nav', JSON.stringify({view:state.view, current:state.current, query:state.query, onlyFav:state.onlyFav})); }catch(e){}
  const targetHash = state.view==='detail' ? (state.current===KEIGO_ID ? '#keigo' : '#'+state.current) : '#list';
  if(location.hash !== targetHash){
    try{
      if(push===false) history.replaceState(null,'', targetHash);
      else if(!location.hash) history.replaceState(null,'', targetHash);
      else history.pushState(null,'', targetHash);
    }catch(e){
      // file:// 等环境 history 异常时回退到直接改 hash
      location.hash = targetHash;
    }
  }
}
function showList(push){
  _navLock = true;
  state.view='list';
  document.getElementById('listView').classList.add('active');
  document.getElementById('detailView').classList.remove('active');
  document.getElementById('backBtn').hidden = true;
  document.getElementById('searchBtn').hidden = false;
  document.getElementById('title').textContent = 'N3 文法 小手册';
  document.getElementById('searchWrap').hidden = !state.query;
  document.getElementById('switchesList').hidden = false;
  document.getElementById('switchesDetail').hidden = true;
  renderList();
  // 恢复搜索框
  const inp = document.getElementById('searchInput');
  if(inp && inp.value !== state.query) inp.value = state.query;
  document.getElementById('searchClear').classList.toggle('show', !!state.query);
  document.getElementById('onlyFav').checked = !!state.onlyFav;
  syncNav(push);
  // 列表滚动位置恢复（hash 恢复时）
  const y = sessionStorage.getItem('n3.scrollY');
  if(y && push===false) setTimeout(()=>window.scrollTo(0, parseInt(y,10)||0), 0);
  else if(push!==false) window.scrollTo(0,0);
  _navLock = false;
}
function openDetail(id, push){
  _navLock = true;
  state.view='detail';
  state.current = id;
  document.getElementById('listView').classList.remove('active');
  document.getElementById('detailView').classList.add('active');
  document.getElementById('backBtn').hidden = false;
  document.getElementById('searchBtn').hidden = true;
  document.getElementById('searchWrap').hidden = true;
  document.getElementById('switchesList').hidden = true;
  document.getElementById('switchesDetail').hidden = false;
  // 进入详情前保存列表滚动位置（仅用户主动跳转时，刷新恢复时不覆盖）
  if(push!==false) try{ sessionStorage.setItem('n3.scrollY', String(window.scrollY)); }catch(e){}
  renderDetail();
  syncNav(push);
  window.scrollTo(0,0);
  _navLock = false;
}
function restoreFromHash(push){
  const raw = (location.hash||'').replace(/^#/,'');
  if(raw === 'keigo'){
    openDetail(KEIGO_ID, push);
    return true;
  }
  const nid = parseInt(raw,10);
  if(!isNaN(nid)){
    // 允许 199 等不存在的编号，renderDetail 会显示“未找到”并保持 hash 停留
    openDetail(nid, push);
    return true;
  }
  if(raw === 'list'){
    // 显式 #list 时也尝试恢复筛选状态
    try{
      const nav = JSON.parse(localStorage.getItem('n3.nav')||'null');
      if(nav){
        if(typeof nav.query==='string') state.query = nav.query;
        if(typeof nav.onlyFav==='boolean') state.onlyFav = nav.onlyFav;
      }
    }catch(e){}
    showList(push);
    return true;
  }
  if(!raw){
    // hash 为空时尝试 localStorage 恢复（刷新但浏览器清 hash 的情况）
    try{
      const nav = JSON.parse(localStorage.getItem('n3.nav')||'null');
      if(nav && nav.view==='detail' && nav.current!=null){
        // 199 等非法编号也允许恢复，保持停留
        if(nav.current===KEIGO_ID || typeof nav.current==='number' || typeof nav.current==='string'){
          // 恢复搜索/筛选
          if(typeof nav.query==='string') state.query = nav.query;
          if(typeof nav.onlyFav==='boolean') state.onlyFav = nav.onlyFav;
          openDetail(nav.current, false);
          return true;
        }
      }
      if(nav && nav.view==='list'){
        if(typeof nav.query==='string') state.query = nav.query;
        if(typeof nav.onlyFav==='boolean') state.onlyFav = nav.onlyFav;
        showList(false);
        return true;
      }
    }catch(e){}
    return false;
  }
  return false;
}

/* ========== 朗读（日语发音，Web Speech API） ========== */
let jaVoice = null;
let ttsAudio = null;
// 清洗后供 TTS 使用：去波浪/斜杠/括号等符号，避免 Chrome 读出怪音
function cleanForTTS(s){
  if(!s) return '';
  return s.replace(/<[^>]+>/g,'')
          .replace(/[〜～〜˜~]/g,'')
          .replace(/[（）()]/g,'')
          .replace(/[\/／]/g,'、')
          .replace(/\s+/g,'')
          .trim();
}
function getPatternSpeakText(item){
  // 优先用 patternHtml 中的假名（ruby rt）拼出发音，避免汉字误读，如 間→あいだ
  if(item.patternHtml){
    const rts = [...item.patternHtml.matchAll(/<rt>(.*?)<\/rt>/g)].map(m=>m[1]);
    if(rts.length) return rts.join('、');
  }
  if(Array.isArray(item.kana) && item.kana.length) return item.kana.join('、');
  return cleanForTTS(item.pattern||'');
}
function pickBestJaVoice(voices){
  const jaVoices = voices.filter(v=>/^ja/i.test(v.lang));
  if(!jaVoices.length) return null;
  function rank(v){
    const n = (v.name||'').toLowerCase();
    if(n.includes('kyoko')||n.includes('otoya')||n.includes('eddy')) return 0;
    if(n.includes('haruka')||n.includes('ayumi')||n.includes('nanami')||n.includes('ichiro')||n.includes('ayumi')) return 1;
    if(n.includes('google')) return 5;
    return 2;
  }
  jaVoices.sort((a,b)=>{
    if(a.localService!==b.localService) return a.localService ? -1 : 1;
    return rank(a)-rank(b);
  });
  return jaVoices[0]||null;
}
function pickJaVoice(){
  if(!('speechSynthesis' in window)) return;
  const voices = speechSynthesis.getVoices();
  jaVoice = pickBestJaVoice(voices);
  if(jaVoice) console.log('[tts] picked', jaVoice.name, jaVoice.lang, jaVoice.localService);
  else if(voices.length) console.warn('[tts] no ja voice, available:', voices.map(v=>`${v.lang}:${v.name}(${v.localService?'local':'net'})`).join(' | '));
}
function waitForVoices(timeout=3000){
  return new Promise(resolve=>{
    if(!('speechSynthesis' in window)) return resolve([]);
    const v0 = speechSynthesis.getVoices();
    if(v0.length) return resolve(v0);
    let done=false;
    const timer=setTimeout(()=>{
      if(done) return; done=true;
      speechSynthesis.removeEventListener('voiceschanged', onChange);
      clearInterval(iv);
      resolve(speechSynthesis.getVoices());
    }, timeout);
    function onChange(){
      if(done) return; done=true;
      clearTimeout(timer); clearInterval(iv);
      speechSynthesis.removeEventListener('voiceschanged', onChange);
      resolve(speechSynthesis.getVoices());
    }
    speechSynthesis.addEventListener('voiceschanged', onChange);
    // 轮询兜底：Chrome 有时不触发 voiceschanged
    const iv=setInterval(()=>{
      const v=speechSynthesis.getVoices();
      if(v.length && !done){
        done=true;
        clearTimeout(timer);
        speechSynthesis.removeEventListener('voiceschanged', onChange);
        clearInterval(iv);
        resolve(v);
      }
    },100);
    // 10s 后强制清理
    setTimeout(()=>clearInterval(iv), 10000);
  });
}
if('speechSynthesis' in window){
  pickJaVoice();
  speechSynthesis.addEventListener('voiceschanged', pickJaVoice);
  setTimeout(pickJaVoice, 600);
  // 预热：Chrome 首次需用户手势前就加载
  waitForVoices(2000).then(pickJaVoice);
}
function getRate(){ return parseFloat(localStorage.getItem('n3.rate')||'1')||1; }
function fallbackAudio(text, rate){
  if(!text) return;
  rate = rate || getRate();
  // 多源回退：谷歌（可能被墙）→ 百度翻译（国内可达）
  const sources = [
    'https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=ja&q=' + encodeURIComponent(text),
    'https://fanyi.baidu.com/gettts?lan=jpn&spd=5&source=web&text=' + encodeURIComponent(text),
    'https://dict.youdao.com/dictvoice?audio=' + encodeURIComponent(text) + '&type=3'
  ];
  if(ttsAudio) try{ttsAudio.pause();}catch(e){}
  let i=0;
  function tryPlay(){
    if(i>=sources.length){
      toast('无可用日语语音：请安装系统日语 TTS 语音包（安卓：设置→系统→语言与输入→文字转语音→Google语音引擎→安装日语；iOS：设置→辅助功能→朗读内容→系统语音→日语）或检查网络');
      return;
    }
    ttsAudio = new Audio(sources[i++]);
    ttsAudio.playbackRate = rate;
    ttsAudio.onerror = ()=>{ try{ttsAudio.pause();}catch(e){} tryPlay(); };
    ttsAudio.play().catch(()=>{ tryPlay(); });
  }
  tryPlay();
}
async function speak(raw, fixedRate){
  if(!raw) return;
  let text = cleanForTTS(raw);
  if(!text) return;
  // 固定倍速（小标题 1x）优先，否则取下拉倍速
  const rate = fixedRate ? parseFloat(fixedRate) : getRate();
  if(!('speechSynthesis' in window)){
    fallbackAudio(text, rate);
    return;
  }
  // 确保 voices 已加载（Chrome 异步）
  let voices = speechSynthesis.getVoices();
  if(!voices.length){
    voices = await waitForVoices(3000);
  }
  const best = pickBestJaVoice(voices);
  if(best) jaVoice = best;
  else {
    // 仍无本地日语语音
    const all = voices.map(v=>`${v.lang}:${v.name}`).join(' | ') || '（空）';
    console.warn('[tts] no ja voice after wait, all:', all);
    // 若 voices 为空，可能是 Chrome 未授权，再等一次
    if(!voices.length){
      toast('日语语音加载中，请 1 秒后再点一次');
      // 主动触发一次空话以唤醒 Chrome 语音引擎
      try{ speechSynthesis.getVoices(); }catch(e){}
      return;
    }
    toast('未检测到本机日语语音，已用网络语音（若无声请安装系统日语语音后刷新）');
    fallbackAudio(text, rate);
    return;
  }
  try{ speechSynthesis.cancel(); }catch(e){}
  // Chrome cancel 是异步的，留 80ms 再 speak 避免被截断/怪音
  setTimeout(()=>{
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ja-JP';
    u.rate = rate;
    u.pitch = 1.0;
    u.volume = 1.0;
    u.voice = jaVoice;
    u.onstart = ()=>console.log('[tts] start', text.slice(0,20), 'voice', jaVoice.name);
    u.onerror = (e)=>{ console.error('[tts] error', e); fallbackAudio(text, rate); };
    u.onend = ()=>console.log('[tts] end');
    if(speechSynthesis.paused) try{speechSynthesis.resume();}catch(e){}
    speechSynthesis.speak(u);
    // Chrome 有时 speak 后仍 suspended，需 resume
    setTimeout(()=>{ if(speechSynthesis.paused) try{speechSynthesis.resume();}catch(e){} }, 100);
  }, 80);
}

/* 轻提示 */
let toastTimer = null;
function toast(msg){
  let el = document.getElementById('toast');
  if(!el){
    el = document.createElement('div');
    el.id = 'toast';
    el.style.cssText = 'position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:99;background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn);border-radius:10px;padding:8px 14px;font-size:13px;max-width:86vw;box-shadow:var(--shadow)';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ el.style.display = 'none'; }, 3500);
}

(() => {
  const el = document.getElementById('detail');
  if(!el) return;
  let sx=0, sy=0, st=0;
  el.addEventListener('touchstart', e=>{
    if(e.touches.length!==1) return;
    sx=e.touches[0].clientX; sy=e.touches[0].clientY; st=Date.now();
  }, {passive:true});
  el.addEventListener('touchend', e=>{
    if(!sx) return;
    const dx=e.changedTouches[0].clientX - sx;
    const dy=e.changedTouches[0].clientY - sy;
    const dt=Date.now()-st;
    sx=0;
    if(Math.abs(dx) < 60 || dt > 600) return;
    if(Math.abs(dx) < Math.abs(dy)*1.5) return;
    if(dx < 0) document.getElementById('nextBtn')?.click();
    else document.getElementById('prevBtn')?.click();
  }, {passive:true});
})();

/* ========== stalking.gif 前台不活跃出现、可拖动、视口中心 ==========
   注意：#stalkingGif 由 renderDetail() 动态注入，必须用 getElementById 每次取，不能启动时缓存
   定位一律用 transform: translate() 驱动（GPU 合成，移动端 left/top transition 不可靠） */
(() => {
  let gifVisible=false, inactivityTimer=null;
  let isDragging=false, dragSX=0, dragSY=0, dragTX=0, dragTY=0, hasMoved=false, userMoved=false;
  const getGif=()=>document.getElementById('stalkingGif');
  // 获取当前可视区域（visualViewport 优先，适配 iOS/Android 地址栏）
  function getViewport(){
    const vv=window.visualViewport;
    if(vv && typeof vv.width==='number' && vv.width>0){
      return { w:vv.width, h:vv.height, left:vv.offsetLeft||0, top:vv.offsetTop||0 };
    }
    return { w:window.innerWidth, h:window.innerHeight, left:0, top:0 };
  }
  function curSize(gif){ return { w:gif.offsetWidth||120, h:gif.offsetHeight||120 }; }
  // 视口中心 transform（面积×2）
  function centerTransform(gif, scale){
    const vp=getViewport();
    const s=curSize(gif);
    const fw=s.w*scale, fh=s.h*scale;
    const x=(vp.left+vp.w/2-fw/2), y=(vp.top+vp.h/2-fh/2);
    return { x, y, str:'translate('+x+'px,'+y+'px) scale('+scale+')' };
  }
  function placeCenter(gif){
    const ct=centerTransform(gif, Math.SQRT2);
    gif._tx=ct.x; gif._ty=ct.y;
    gif.style.transform=ct.str;
  }
  // 滚动/地址栏变化时保持可视区中心（未拖动时）
  function keepCentered(){
    const gif=getGif(); if(!gif || !gifVisible || isDragging || userMoved) return;
    gif.style.transition='none';
    placeCenter(gif);
  }
  // 重算尺寸（仅非拖动时），配合 keepCentered 重新居中
  function positionStalking(){
    const gif=getGif(); if(!gif) return;
    const h2=document.querySelector('.detail h2');
    const detail=document.querySelector('.detail');
    if(!h2||!detail) return;
    const dRect=detail.getBoundingClientRect();
    const span=h2.querySelector('span');
    const btn=h2.querySelector('.speak');
    const spanW=span?span.offsetWidth:0;
    const btnW=btn?btn.offsetWidth:0;
    const gap=8;
    const blankW = Math.max(0, dRect.width - spanW - btnW - gap*3 - 32);
    const blankH = h2.offsetHeight + 60;
    void dRect; void blankW;
    const maxSquare = Math.min(blankW>0?blankW:120, blankH>0?blankH:120, 192);
    const size = Math.max(48, Math.min(maxSquare*0.9, 192));
    const finalSize = window.innerWidth<600 ? Math.min(size, 120) : size;
    if(!isDragging){
      gif.style.width=finalSize+'px';
      gif.style.height=finalSize+'px';
    }
    if(gifVisible) keepCentered();
  }
  function onStart(e){
    const gif=getGif(); if(!gif) return;
    if(!e.target || !(e.target.closest && e.target.closest('#stalkingGif'))) return;
    isDragging=true; hasMoved=false;
    const p=e.touches ? e.touches[0] : e;
    dragSX=p.clientX; dragSY=p.clientY;
    dragTX=gif._tx||0; dragTY=gif._ty||0;
    gif.style.cursor='grabbing'; gif.style.transition='none';
    gif.style.pointerEvents='auto';
  }
  function onMove(e){
    if(!isDragging) return;
    const gif=getGif(); if(!gif) return;
    const p=e.touches ? e.touches[0] : e;
    const dx=p.clientX-dragSX, dy=p.clientY-dragSY;
    if(Math.abs(dx)>3||Math.abs(dy)>3){ hasMoved=true; userMoved=true; }
    gif._tx=dragTX+dx; gif._ty=dragTY+dy;
    gif.style.transform='translate('+gif._tx+'px,'+gif._ty+'px) scale('+Math.SQRT2+')';
    try{ e.preventDefault(); }catch(err){}
  }
  function onEnd(){
    if(!isDragging) return;
    const gif=getGif(); if(gif){ gif.style.cursor='grab'; gif.style.transition='opacity .6s, transform .6s'; }
    isDragging=false;
  }
  function showGif(){
    const gif=getGif(); if(!gif) return;
    userMoved=false;
    const vw=window.innerWidth, vh=window.innerHeight;
    const vp=getViewport();
    const s=curSize(gif);
    const scale=Math.SQRT2; // 面积×2 = 边长×√2
    const ct=centerTransform(gif, scale);
    const isMobile = vw < 600;
    const isPortrait = vw <= vh;
    const startScale = isMobile ? 0.3 : 1;
    const pad=16;
    let startX, startY;
    if(isMobile && isPortrait){
      // 移动端竖屏：从「接续」处出现，随后移向可视区中心并放大
      const conn=document.querySelector('.sense .section');
      if(conn){
        const r=conn.getBoundingClientRect();
        startX = r.left + r.width/2 - s.w/2;
        startY = r.top + r.height/2 - s.h/2;
      } else { startX=ct.x; startY=ct.y; }
    } else if(isMobile){
      // 移动端横屏：固定从可视区中心出现并放大，不位移
      startX=ct.x; startY=ct.y;
    } else {
      startX=vp.left+pad + Math.random()*Math.max(10, vp.w-s.w-pad*2);
      startY=vp.top+pad + Math.random()*Math.max(10, vp.h-s.h-pad*2);
    }
    gif.style.position='fixed'; gif.style.left='0'; gif.style.top='0'; gif.style.right='auto';
    gif.style.width=s.w+'px'; gif.style.height=s.h+'px';
    gif.style.transition='opacity .7s ease, transform 4s ease-in-out';
    gif._tx=startX; gif._ty=startY;
    gif.style.transform='translate('+startX+'px,'+startY+'px) scale('+startScale+')';
    gif.style.opacity='0.92';
    gif.style.pointerEvents='auto';
    // 双 rAF 确保起点渲染后 transition 生效（Safari/移动端单 reflow 不可靠）
    requestAnimationFrame(()=>{
      requestAnimationFrame(()=>{
        gif._tx=ct.x; gif._ty=ct.y;
        gif.style.transform=ct.str;
      });
    });
    gifVisible=true;
    clearTimeout(inactivityTimer);
  }
  function hideGif(){
    const gif=getGif(); if(gif){
      gif.style.opacity='0';
      gif.style.pointerEvents='none';
      gif.style.transform='translate('+(gif._tx||0)+'px,'+(gif._ty||0)+'px) scale(0.9)';
    }
    gifVisible=false;
    startInactivityTimer();
  }
  function startInactivityTimer(){
    clearTimeout(inactivityTimer);
    if(gifVisible) return;
    if(document.visibilityState!=='visible') return;
    if(!document.getElementById('detailView')?.classList.contains('active')) return;
    inactivityTimer=setTimeout(()=>{
      if(document.visibilityState!=='visible') return;
      if(!document.getElementById('detailView')?.classList.contains('active')) return;
      showGif();
    }, 60000);
  }
  function resetInactivityTimer(){
    if(gifVisible) return;
    startInactivityTimer();
  }
  hideGif();
  startInactivityTimer();
  // 不活跃：前台可见且 5 秒无 mousemove/click/scroll/keydown/touch
  ["mousemove","click","scroll","keydown","touchstart"].forEach(ev=>{
    window.addEventListener(ev, resetInactivityTimer, {passive:true});
  });
  document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState==='visible'){
      if(!gifVisible) startInactivityTimer();
    } else {
      clearTimeout(inactivityTimer);
    }
  });
  // 拖动（事件委托，因 gif 动态重建）
  document.addEventListener('mousedown', onStart);
  document.addEventListener('touchstart', onStart, {passive:false});
  window.addEventListener('mousemove', onMove);
  window.addEventListener('touchmove', onMove, {passive:false});
  window.addEventListener('mouseup', onEnd);
  window.addEventListener('touchend', onEnd);
  // 点击 GIF 才消失并重计
  document.addEventListener('click', e=>{
    if(hasMoved){ hasMoved=false; return; }
    if(e.target && e.target.closest && e.target.closest('#stalkingGif')){
      hideGif();
    }
  });
  // 详情显隐联动：切到详情重计，切走隐藏
  const detailView=document.getElementById('detailView');
  if(detailView) new MutationObserver(()=>{
    if(detailView.classList.contains('active')){
      if(!gifVisible) startInactivityTimer();
    } else {
      hideGif();
      clearTimeout(inactivityTimer);
    }
  }).observe(detailView, {attributes:true, attributeFilter:['class']});
  window.addEventListener('resize', positionStalking);
  // 滚动 / 地址栏 / 可视区变化时保持可视区中心（fixed+transform 不随内容滚动）
  window.addEventListener('scroll', keepCentered, {passive:true});
  window.addEventListener('resize', keepCentered);
  const vv=window.visualViewport;
  if(vv){
    vv.addEventListener('resize', keepCentered);
    vv.addEventListener('scroll', keepCentered);
  }
  const detail=document.getElementById('detail');
  if(detail) new MutationObserver(()=>{
    positionStalking();
    // 切换卡片重建 DOM 后保持 GIF 可见
    if(gifVisible) restoreGif();
  }).observe(detail, {childList:true, subtree:true});
  // 切卡后恢复显示；有 _stkPos 则保持原位（不移动），否则回可视区中心
  function restoreGif(){
    const gif=getGif(); if(!gif) return;
    gif.style.transition='none';
    if(window._stkPos){
      gif._tx=window._stkPos.x; gif._ty=window._stkPos.y;
      gif.style.transform='translate('+gif._tx+'px,'+gif._ty+'px) scale('+Math.SQRT2+')';
      delete window._stkPos;
    } else {
      placeCenter(gif);
    }
    gif.style.opacity='0.92';
    gif.style.pointerEvents='auto';
  }
})();

/* ========== 强制登录 ========== */
const REQUIRE_LOGIN = true; // 设 false 即关闭强制登录
const LOGIN_URL = "./login.html";
function getApiBase(){ try{ return (localStorage.getItem("jlpt_api")||"https://jlpt.zhxsdxin.workers.dev").replace(/\/$/,"") || "https://jlpt.zhxsdxin.workers.dev"; }catch(e){ return "https://jlpt.zhxsdxin.workers.dev"; } }
function getToken(){ try{ return localStorage.getItem("jlpt_token")||""; }catch(e){ return ""; } }
async function requireLogin(){
  if(!REQUIRE_LOGIN) return true;
  const token = getToken();
  if(!token){ location.href = LOGIN_URL + "?redirect=" + encodeURIComponent(location.href); return false; }
  try{
    const r = await fetch(getApiBase()+"/api/me",{headers:{Authorization:"Bearer "+token}});
    const j = await r.json();
    if(!j.user){ localStorage.removeItem("jlpt_token"); location.href = LOGIN_URL + "?redirect=" + encodeURIComponent(location.href); return false; }
    return true;
  }catch(e){
    // worker 未部署/离线时，退化为本地 token 存在即放行，避免首屏卡死
    return !!token;
  }
}

async function refreshProfileAvatar(){
  const btn=document.getElementById("profileBtn"); if(!btn) return;
  const token=getToken();
  const isAdminUser=(u)=>u && u.username==="admin";
  // SWR 先显旧（lastUser + mock）避免 admin 闪回 🐱
  let stale = null;
  try{
    const last = JSON.parse(localStorage.getItem("jlpt_last_user")||"null");
    if(last && last.username==="admin"){ btn.textContent="🐭"; stale="mouse"; }
    else if(last && last.avatar){ btn.innerHTML=`<img src="${last.avatar}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`; stale="custom"; }
    else if(last){ btn.textContent="🐱"; stale="cat"; }
  }catch(e){}
  try{
    if(!token){ if(!stale) btn.textContent="🐱"; stale=stale||"cat"; }
    else if(!stale){
      const users=JSON.parse(localStorage.getItem("mock_users")||"[]");
      const sessions=JSON.parse(localStorage.getItem("mock_sessions")||"[]");
      const s=sessions.find(x=>x.token===token); const u=s?users.find(x=>x.id===s.user_id):null;
      if(u){
        if(u.username==="admin"){ btn.textContent="🐭"; stale="mouse"; }
        else if(u.avatar){ btn.innerHTML=`<img src="${u.avatar}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`; stale="custom"; }
        else { btn.textContent="🐱"; stale="cat"; }
      }
    }
  }catch(e){}
  // 后台再验真库，平滑更新
  try{
    const r=await fetch(getApiBase()+"/api/me",{headers:{Authorization:"Bearer "+token}});
    const j=await r.json();
    if(j.user){
      try{ localStorage.setItem("jlpt_last_user", JSON.stringify(j.user)); }catch(e){}
      const isAdmin=isAdminUser(j.user);
      const next = isAdmin ? "mouse" : (j.user.avatar ? "custom" : "cat");
      if(next !== stale){
        if(isAdmin) btn.textContent="🐭";
        else if(j.user.avatar) btn.innerHTML=`<img src="${j.user.avatar}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`;
        else btn.textContent="🐱";
      }
      return;
    }
    if(!stale) btn.textContent="🐱";
  }catch(e){ if(!stale) btn.textContent="🐱"; }
}

// 关闭上报：登录时长按 关闭时间-登录时间（24h 过期）
window.addEventListener('pagehide', ()=>{
  const t=getToken(); if(!t) return;
  const url=getApiBase()+"/api/close";
  try{ navigator.sendBeacon(url, JSON.stringify({token:t})); }catch(e){}
  try{ fetch(url,{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+t},body:JSON.stringify({token:t}),keepalive:true}); }catch(e){}
});
window.addEventListener('beforeunload', ()=>{
  const t=getToken(); if(!t) return;
  try{ navigator.sendBeacon(getApiBase()+"/api/close", JSON.stringify({token:t})); }catch(e){}
});

/* ========== 启动（SWR：先显旧数据，后台再验） ========== */
(async ()=>{
  // 立即显旧（避免 0.5-1s 白屏）
  if(!restoreFromHash(false)) showList(false);
  // 后台拉卡片覆盖，命中再平滑重渲
  loadCardOverrides().then(updated=>{
    if(updated){
      if(state.view==='list') renderList();
      else renderDetail();
    }
  });
  if(REQUIRE_LOGIN && !(await requireLogin())) return;
  // 头像 SWR：先显本地旧头像，后台再验
  refreshProfileAvatar();
  try{
    const r=await fetch(getApiBase()+"/api/me",{headers:{Authorization:"Bearer "+getToken()}});
    const j=await r.json();
    if(j.user && j.user.username==="admin") document.getElementById("adminBtn").hidden=false;
  }catch(e){}
})();
