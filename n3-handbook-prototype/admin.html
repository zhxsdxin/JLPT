<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#1f3a5f"/>
<title>管理 - N3 文法 小手册</title>
<style>
  :root{--bg:#f6f4ee;--card:#ffffff;--ink:#1c2434;--ink-soft:#475063;--muted:#7a8597;--line:#e6e2d6;--accent:#1f3a5f;--accent-soft:#dde6f1;--warn:#8a5a00;--warn-bg:#fff5dc;--shadow:0 1px 2px rgba(20,30,50,.06),0 6px 18px rgba(20,30,50,.06);--radius:14px}
  @media (prefers-color-scheme: dark){:root{--bg:#101521;--card:#172033;--ink:#eef1f6;--ink-soft:#b9c2d2;--muted:#8392a8;--line:#26324a;--accent:#9ec0ea;--accent-soft:#1d2c46;--warn:#f1c179;--warn-bg:#3a2e16;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35)}}
  *{box-sizing:border-box} html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Hiragino Sans","Yu Gothic","PingFang SC","Microsoft YaHei",sans-serif}
  a{color:var(--accent);text-decoration:none}
  .topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.85);backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--line)}
  @media (prefers-color-scheme: dark){.topbar{background:rgba(16,21,33,.78)}}
  .topbar-inner{display:flex;align-items:center;gap:8px;padding:10px 14px;max-width:900px;margin:0 auto}
  .topbar h1{font-size:17px;margin:0;font-weight:800;flex:1;background:linear-gradient(135deg,var(--accent) 0%,#ff7a8a 70%);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .icon-btn{width:36px;height:36px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink-soft)}
  .wrap{max-width:900px;margin:0 auto;padding:12px 14px 40px}
  .tabs{display:flex;gap:8px;margin-top:12px}
  .tab{padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:13px}
  .tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;margin-top:12px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);word-break:break-all}
  th{color:var(--muted);font-size:11px;letter-spacing:.06em}
  .inp{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:13px;margin:4px 0}
  .btn{padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:13px}
  .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btn.danger{color:#c0392b;border-color:#ffcccc}
  .muted{font-size:12px;color:var(--muted)}
  pre{white-space:pre-wrap;word-break:break-all;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;font-size:11px;max-height:240px;overflow:auto}
  @media (max-width:600px){
    table{font-size:11px}
    th,td{padding:4px 6px}
    /* 窄屏精简：头像与 token 列隐藏，时间仅 hh:mm 已由 JS 处理 */
    #pane-users th:nth-child(3), #pane-users td:nth-child(3){display:none}
    #pane-sessions th:last-child, #pane-sessions td:last-child{display:none}
  }
</style>
</head>
<body>
<header class="topbar"><div class="topbar-inner">
  <a class="icon-btn" href="./index.html">‹</a><h1>ADMIN · 管理</h1><a class="icon-btn" href="./profile.html">🐭</a>
</div></header>
<main class="wrap">
  <div id="gate" class="card" style="display:none">需 <b>admin</b> 账号登录。<a id="gateLogin" href="./login.html">去登录</a></div>

  <div id="main" style="display:none">
    <div class="tabs">
      <button class="tab active" data-t="users">用户</button>
      <button class="tab" data-t="sessions">登录时长</button>
      <button class="tab" data-t="cards">卡片 JS</button>
    </div>

    <div id="pane-users" class="card">
      <h3 style="margin:0 0 8px">用户数据 <span class="muted" id="uCount"></span></h3>
      <table><thead><tr><th>ID</th><th>用户名</th><th>头像</th><th>注册</th><th>会话数</th><th>最后登录</th></tr></thead><tbody id="uBody"></tbody></table>
      <pre id="uRaw" style="display:none"></pre>
    </div>

    <div id="pane-sessions" class="card" style="display:none">
      <h3 style="margin:0 0 8px">会话 / 登录时长 <span class="muted">（时长=关闭时间-登录时间，过期24h）</span></h3>
      <div class="muted">登录/关闭时间按浏览器本地时区 <code id="tzShow"></code> 显示（存 UTC）</div>
      <table><thead><tr><th>用户</th><th>登录(本地)</th><th>关闭/过期</th><th>时长</th><th>状态</th><th>token</th></tr></thead><tbody id="sBody"></tbody></table>
    </div>

    <div id="pane-cards" class="card" style="display:none">
      <h3 style="margin:0 0 8px">卡片 JS (N3_DATA)</h3>
      <div class="muted">修改后存 D1 <code>card_overrides</code>，前端优先读覆盖；留空删覆盖。</div>
      <div style="display:flex;gap:8px;margin:8px 0">
        <input id="cardId" class="inp" placeholder="卡片 ID，如 1" style="flex:0 0 100px">
        <button class="btn" id="cardLoad">加载</button>
        <button class="btn" id="cardList">全部覆盖</button>
      </div>
      <textarea id="cardJson" class="inp" style="height:260px;font-family:monospace" placeholder='{"pattern":"...","senses":[...]}'></textarea>
      <div style="display:flex;gap:8px">
        <button class="btn primary" id="cardSave">保存覆盖</button>
        <button class="btn danger" id="cardDel">删除覆盖</button>
      </div>
      <pre id="cardOut"></pre>
      <div id="cardLib" style="margin-top:10px;max-height:260px;overflow:auto"></div>
    </div>
  </div>
</main>
<script src="./data.js"></script>
<script>
const apiBase = (localStorage.getItem("jlpt_api")||"https://jlpt.zhxsdxin.workers.dev").replace(/\/$/,"");
const tokenKey="jlpt_token";
const headers=()=>{const t=localStorage.getItem(tokenKey);return t?{Authorization:"Bearer "+t}:{}};
const $=id=>document.getElementById(id);
// 浏览器本地时区展示（最合理：存 UTC，显本地）- 兼容 SQLite "YYYY-MM-DD HH:MM:SS" UTC
const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
const tzDisplay = tz === "Asia/Tokyo" ? "JST" : tz;
const parseUTC = s=>{
  if(!s) return null;
  if(/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$/.test(s)) return new Date(s.replace(" ","T")+"Z");
  return new Date(s);
};
const fmt = s=> {
  const d=parseUTC(s); if(!d||isNaN(d)) return "-";
  const isNarrow = window.innerWidth < 600;
  if(isNarrow){
    return d.toLocaleString(undefined,{hour:"2-digit",minute:"2-digit",hour12:false,timeZone:tz});
  }
  return d.toLocaleString(undefined,{year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit",timeZone:tz, hour12:false}) + ` (${tzDisplay})`;
};
const fmtDate = s=> {
  const d=parseUTC(s); if(!d||isNaN(d)) return "-";
  return d.toLocaleDateString(undefined,{year:"numeric",month:"2-digit",day:"2-digit",timeZone:tz});
};
const fmtTime = s=> {
  const d=parseUTC(s); if(!d||isNaN(d)) return "-";
  return d.toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false,timeZone:tz});
};
const dur = sec=>{ if(sec==null) return "-"; const h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), sec2=sec%60; if(h) return `${h}h ${m}m`; if(m) return `${m}m ${sec2}s`; return `${sec2}s`; };

async function checkAdmin(){
  try{
    const r=await fetch(apiBase+"/api/me",{headers:headers()});
    const j=await r.json();
    if(j.user && j.user.username==="admin"){ $("main").style.display="block"; return true; }
  }catch(e){}
  // mock 兜底
  try{
    const t=localStorage.getItem(tokenKey);
    const users=JSON.parse(localStorage.getItem("mock_users")||"[]");
    const sessions=JSON.parse(localStorage.getItem("mock_sessions")||"[]");
    const s=sessions.find(x=>x.token===t); const u=s?users.find(x=>x.id===s.user_id):null;
    if(u && u.username==="admin"){ $("main").style.display="block"; return true; }
  }catch(e){}
  $("gate").style.display="block";
  const g=$("gateLogin"); if(g) g.href="./login.html?redirect="+encodeURIComponent("./admin.html");
  return false;
}
checkAdmin().then(ok=>{ if(ok){ loadUsers(); loadSessions(); renderCardLib(); } });
// 关闭上报：时长按 关闭时间-登录时间
window.addEventListener('pagehide', ()=>{
  const t=localStorage.getItem(tokenKey); if(!t) return;
  const url=apiBase+"/api/close";
  try{ navigator.sendBeacon(url, JSON.stringify({token:t})); }catch(e){}
  try{ fetch(url,{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+t},body:JSON.stringify({token:t}),keepalive:true}); }catch(e){}
});
window.addEventListener('beforeunload', ()=>{
  const t=localStorage.getItem(tokenKey); if(!t) return;
  try{ navigator.sendBeacon(apiBase+"/api/close", JSON.stringify({token:t})); }catch(e){}
});

const savedTab = localStorage.getItem("admin_tab") || "users";
document.querySelectorAll(".tab").forEach(b=>{
  b.classList.toggle("active", b.dataset.t===savedTab);
});
$("pane-users").style.display=savedTab==="users"?"block":"none";
$("pane-sessions").style.display=savedTab==="sessions"?"block":"none";
$("pane-cards").style.display=savedTab==="cards"?"block":"none";
document.querySelectorAll(".tab").forEach(b=>{
  b.onclick=()=>{
    const t=b.dataset.t;
    localStorage.setItem("admin_tab", t);
    document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active")); b.classList.add("active");
    $("pane-users").style.display=t==="users"?"block":"none";
    $("pane-sessions").style.display=t==="sessions"?"block":"none";
    $("pane-cards").style.display=t==="cards"?"block":"none";
    if(t==="users") loadUsers();
    if(t==="sessions") loadSessions();
  };
});

async function loadUsers(){
  const r=await fetch(apiBase+"/api/admin/users",{headers:headers()});
  const j=await r.json();
  if(j.error){ $("uBody").innerHTML=`<tr><td colspan=6>${j.error}</td></tr>`; return; }
  $("uCount").textContent=`共 ${j.length} 人 (上限 5)`;
  const isNarrow = window.innerWidth < 600;
  $("uBody").innerHTML=j.map(u=>{
    const avatar = u.username==="admin"
      ? `🐭`
      : (u.avatar?`<img src="${u.avatar}" style="width:28px;height:28px;border-radius:50%;object-fit:cover">`:"🐱");
    const reg = isNarrow ? fmtDate(u.created_at) : fmt(u.created_at);
    const last = isNarrow ? fmtDate(u.last_login) : fmt(u.last_login);
    return `<tr><td>${u.id}</td><td>${u.username}</td><td>${avatar}</td><td>${reg}</td><td>${u.session_count}</td><td>${last}</td></tr>`;
  }).join("");
}
async function loadSessions(){
  $("tzShow").textContent = tzDisplay;
  const r=await fetch(apiBase+"/api/admin/sessions",{headers:headers()});
  const j=await r.json();
  if(j.error){ $("sBody").innerHTML=`<tr><td colspan=6>${j.error}</td></tr>`; return; }
  const isNarrow = window.innerWidth < 600;
  $("sBody").innerHTML=j.map(s=>{
    const login = isNarrow ? fmtDate(s.created_at) : fmt(s.created_at);
    const closeOrExp = s.closed_at ? (isNarrow ? fmtTime(s.closed_at) : fmt(s.closed_at)) : (isNarrow ? fmtTime(s.expires_at) : `${fmt(s.expires_at)} 到期`);
    const status = s.closed_at ? "已关闭" : (parseUTC(s.expires_at) < new Date() ? "已过期(24h)" : "进行中");
    return `<tr><td>${s.username}</td><td>${login}</td><td>${closeOrExp}</td><td>${dur(s.duration_sec)}</td><td>${status}</td><td title="${s.token}">${s.token.slice(0,8)}…</td></tr>`;
  }).join("") || `<tr><td colspan=6>无会话</td></tr>`;
}

function renderCardLib(){
  const lib=$("cardLib");
  if(typeof N3_DATA==="undefined"){ lib.textContent="N3_DATA 未加载"; return; }
  lib.innerHTML=N3_DATA.slice(0,50).map(x=>`<div style="padding:4px 0;border-bottom:1px dashed var(--line);font-size:12px"><b>No.${x.id}</b> ${x.pattern} <button class="btn" style="padding:2px 6px;font-size:11px" onclick="document.getElementById('cardId').value=${x.id};document.getElementById('cardLoad').click()">编辑</button></div>`).join("") + `<div class="muted">共 ${N3_DATA.length} 条，仅列 50</div>`;
}
$("cardLoad").onclick=async()=>{
  const id=$("cardId").value.trim(); if(!id) return;
  // 优先读覆盖
  let r=await fetch(apiBase+"/api/admin/card?id="+id,{headers:headers()}); let j=await r.json();
  if(j){ $("cardJson").value=JSON.stringify(j,null,2); $("cardOut").textContent="命中覆盖"; return; }
  // 回退 N3_DATA
  const item=(typeof N3_DATA!=="undefined"?N3_DATA.find(x=>String(x.id)===String(id)):null);
  if(item) $("cardJson").value=JSON.stringify(item,null,2); else $("cardOut").textContent="未找到";
};
$("cardList").onclick=async()=>{
  const r=await fetch(apiBase+"/api/admin/card",{headers:headers()}); const j=await r.json(); $("cardOut").textContent=JSON.stringify(j,null,2);
};
$("cardSave").onclick=async()=>{
  const id=$("cardId").value.trim(); let data;
  try{ data=JSON.parse($("cardJson").value); }catch(e){ return $("cardOut").textContent="JSON 解析失败: "+e; }
  const r=await fetch(apiBase+"/api/admin/card",{method:"POST",headers:{"Content-Type":"application/json",...headers()},body:JSON.stringify({id,data})});
  $("cardOut").textContent=JSON.stringify(await r.json(),null,2);
};
$("cardDel").onclick=async()=>{
  const id=$("cardId").value.trim(); if(!id) return;
  const r=await fetch(apiBase+"/api/admin/card?id="+id,{method:"DELETE",headers:headers()});
  $("cardOut").textContent=JSON.stringify(await r.json(),null,2);
};
</script>
</body>
</html>
